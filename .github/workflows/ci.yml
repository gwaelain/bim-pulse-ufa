name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка внутренних ссылок (офлайн)
        run: python3 tools/check_links.py

      - name: Гард размера изображений (> 500 КБ = провал)
        run: |
          big=$(find . -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.webp' \) -size +500k)
          if [ -n "$big" ]; then
            echo "::error::Изображения больше 500 КБ:"; echo "$big"; exit 1
          fi
          echo "OK: изображений > 500 КБ нет"
